name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Типы, юнит-тесты, сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  database:
    name: Тесты базы и e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Запуск локального Supabase
        run: npx supabase start -x studio,imgproxy,storage-api,edge-runtime,logflare,vector,realtime,mailpit,postgres-meta,supavisor
      - name: Ключи локального Supabase
        run: |
          npx supabase status -o env | grep -E '^(API_URL|ANON_KEY)=' | sed -e 's/^API_URL=/VITE_SUPABASE_URL=/' -e 's/^ANON_KEY=/VITE_SUPABASE_ANON_KEY=/' | tr -d '"' > .env.local
          cat .env.local | cut -c1-40
      - name: Миграция применяется при пустом search_path (как в SQL Editor)
        run: |
          DB=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          psql "$DB" -q -v ON_ERROR_STOP=1 -f supabase/uninstall.sql
          PGOPTIONS="-c search_path=" psql "$DB" -q -v ON_ERROR_STOP=1 -1 -f supabase/migrations/20260928000001_init.sql
      - run: npm run test:db
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
